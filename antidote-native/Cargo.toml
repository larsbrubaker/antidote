[package]
name = "antidote-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native (winit + wgpu-presented agg-gui) shell for the Antidote game."

[[bin]]
name = "antidote-native"
path = "src/main.rs"
test = false

[dependencies]
antidote-core = { path = "../antidote-core" }
agg-gui = { workspace = true, features = ["clipboard"] }
# The window, event loop, wgpu surface, input forwarding and present all come
# from agg-gui-shell now; this crate owns no winit/wgpu code of its own.
agg-gui-shell = { workspace = true }
serde_json = { workspace = true }
dirs = "5"
