[package]
name = "antidote-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native (winit + wgpu-presented agg-gui) shell for the Antidote game."

[[bin]]
name = "antidote-native"
path = "src/main.rs"
test = false

[dependencies]
antidote-core = { path = "../antidote-core" }
agg-gui = { workspace = true, features = ["winit-adapter", "clipboard"] }
demo-wgpu = { workspace = true }
serde_json = { workspace = true }
dirs = "5"
pollster = "0.4"
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan", "dx12", "metal"] }
winit = "0.30"
