<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <!-- The Apple-specific tag is deprecated in favour of the WHATWG-standard
         `mobile-web-app-capable`; keep the Apple version for older iOS
         versions that don't yet honour the standard one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Suppress the /favicon.ico 404. Real favicon can replace this later. -->
    <link rel="icon" href="data:," />
    <title>Antidote</title>
    <style>
      /* Canvas fills the entire viewport. We avoid the
         html→body→canvas percent-height cascade that green-screened
         on Android Chrome (and produced a permanently-black canvas
         here); instead the canvas has explicit buffer attributes (so
         the first paint sees a non-zero buffer) and main.ts sets
         `canvas.style.{width,height}` in CSS pixels off
         `documentElement.clientWidth/Height`. No CSS percent heights
         on the canvas itself. Matches Solitaire, which is the
         known-working mobile sibling of this game. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { -webkit-tap-highlight-color: transparent; }
      canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="antidote-canvas" width="800" height="600"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
