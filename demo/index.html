<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Antidote</title>
    <style>
      /* Page locked to the layout viewport — no scrolling, no rubber-banding.
         The canvas inside is sized explicitly from JS each frame, so the page
         CSS deliberately does NOT size the canvas with `dvh`/`dvw`. Reason:
         in Chrome DevTools' device emulator and on some Android browsers,
         `100dvw` reads the *outer* browser window rather than the emulated /
         visible viewport, so the canvas ends up wider than what the user can
         see and everything shifts off-screen to the right. JS-driven sizing
         via `visualViewport` matches what the user actually sees. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
      }
      #antidote-canvas {
        position: fixed;
        top: 0;
        left: 0;
        display: block;
        touch-action: none;
        background: #000;
      }
    </style>
  </head>
  <body>
    <canvas id="antidote-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
