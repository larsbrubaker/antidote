[workspace]
resolver = "2"
members = ["antidote-core", "antidote-native", "antidote-wasm"]
default-members = ["antidote-core", "antidote-native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
repository = "https://github.com/larsbrubaker/antidote"

[workspace.dependencies]
agg-gui = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
rapier2d = "0.22"

# ---------------------------------------------------------------------------
# Local development overrides
# ---------------------------------------------------------------------------
# Uncomment to develop against a local agg-gui checkout next door (via the
# rust-apps superproject layout). CI builds against crates.io.
#
# [patch.crates-io]
# agg-gui = { path = "../agg-gui/agg-gui" }

# ---------------------------------------------------------------------------
# Optimize dependencies in debug builds. The agg-rust software rasterizer +
# rapier2d are both expensive unoptimized — without this dev frame time drops
# to ~5 fps. Mirrors agg-gui's own workspace profile.
# ---------------------------------------------------------------------------
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
