[workspace]
resolver = "2"
members = ["antidote-core", "antidote-native", "antidote-wasm"]
default-members = ["antidote-core", "antidote-native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
repository = "https://github.com/larsbrubaker/antidote"

[workspace.dependencies]
agg-gui = "0.2"
demo-wgpu = { path = "../agg-gui/demo-wgpu", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
box2d-rust = "1.0"

# ---------------------------------------------------------------------------
# Local development overrides — see CLAUDE.md "Local development uses agg-gui
# as a path dep". The rust-apps superproject lays out agg-gui and box2d-rust
# as siblings at ../agg-gui/ and ../box2d-rust/. CI clones them the same way
# (see .github/workflows/ci.yml + deploy-demo.yml) so these patches resolve
# both locally and in Actions.
# ---------------------------------------------------------------------------
[patch.crates-io]
agg-gui = { path = "../agg-gui/agg-gui" }
box2d-rust = { path = "../box2d-rust" }

# ---------------------------------------------------------------------------
# Optimize dependencies in debug builds. The agg-rust software rasterizer +
# box2d-rust are both expensive unoptimized — without this dev frame time drops
# to ~5 fps. Mirrors agg-gui's own workspace profile.
# ---------------------------------------------------------------------------
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
